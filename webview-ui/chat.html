<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCE Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: var(--vscode-font-family);
      color: var(--vscode-foreground);
      background: var(--vscode-sideBar-background);
    }

    /* ── header ── */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
    }
    .chat-header h1 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      flex: 1;
    }
    .chat-header .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--vscode-foreground);
      cursor: pointer;
      opacity: 0.6;
    }
    .chat-header .icon-btn:hover {
      background: var(--vscode-toolbar-hoverBackground);
      opacity: 1;
    }

    .session-list {
      border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
      background: var(--vscode-sideBar-background);
    }
    .session-list-header {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--vscode-descriptionForeground);
    }
    .session-list-header span { flex: 1; }
    .session-list-header button {
      background: none; border: none; color: var(--vscode-foreground);
      cursor: pointer; font-size: 16px; opacity: 0.6;
    }
    .session-list-header button:hover { opacity: 1; }
    .session-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      cursor: pointer;
      border-top: 1px solid var(--vscode-sideBarSectionHeader-border);
    }
    .session-item:hover { background: var(--vscode-list-hoverBackground); }
    .session-item.active { background: var(--vscode-list-activeSelectionBackground); }
    .session-item .si-title {
      flex: 1;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-item .si-time {
      font-size: 10px;
      color: var(--vscode-descriptionForeground);
      margin-left: 8px;
      flex-shrink: 0;
    }
    .session-item .si-del {
      background: none;
      border: none;
      color: var(--vscode-foreground);
      cursor: pointer;
      opacity: 0;
      font-size: 14px;
      padding: 0 4px;
      margin-left: 4px;
    }
    .session-item:hover .si-del { opacity: 0.5; }
    .session-item .si-del:hover { opacity: 1; }

    /* ── messages ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .chat-messages .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--vscode-descriptionForeground);
      text-align: center;
      gap: 8px;
    }
    .chat-messages .empty-state svg { opacity: 0.35; }

    /* ── input ── */
    .chat-input {
      border-top: 1px solid var(--vscode-sideBarSectionHeader-border);
      padding: 10px 12px;
    }
    .chat-input textarea {
      display: block;
      width: 100%;
      resize: none;
      border: 1px solid var(--vscode-input-border);
      background: var(--vscode-input-background);
      color: var(--vscode-input-foreground);
      font-family: var(--vscode-font-family);
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      min-height: 36px;
      max-height: 120px;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .chat-input textarea:focus {
      outline: 1px solid var(--vscode-focusBorder);
      outline-offset: -1px;
    }

    .input-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-toolbar select {
      background: var(--vscode-input-background);
      color: var(--vscode-input-foreground);
      border: 1px solid var(--vscode-input-border);
      font-family: var(--vscode-font-family);
      font-size: 12px;
      padding: 0 6px;
      border-radius: 4px;
      max-width: 150px;
      height: 28px;
    }
    .input-toolbar button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      cursor: pointer;
    }
    .input-toolbar button.stop-btn {
      background: var(--vscode-inputValidation-errorBorder);
    }
    .input-toolbar button.attach-btn {
      background: transparent;
      color: var(--vscode-foreground);
      opacity: 0.6;
      border-radius: 4px;
    }
    .input-toolbar button.attach-btn:hover {
      background: var(--vscode-toolbar-hoverBackground);
      opacity: 1;
    }

    /* ── image preview strip ── */
    .image-preview-strip {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .image-thumb {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--vscode-input-border);
      flex-shrink: 0;
    }
    .image-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-thumb .remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-thumb.warn {
      border-color: var(--vscode-inputValidation-warningBorder, #cca700);
    }
    .image-size-warn {
      width: 100%;
      font-size: 11px;
      color: var(--vscode-inputValidation-warningForeground, #cca700);
      margin-bottom: 2px;
    }

    /* ── images inside user message bubbles ── */
    .msg-images {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    .msg-image {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--vscode-sideBarSectionHeader-border);
    }
    .msg-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    /* ── message bubbles ── */
    .message {
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.user {
      background: var(--vscode-input-background);
      border: 1px solid var(--vscode-input-border);
      margin-left: 24px;
      white-space: pre-wrap;
    }
    .message.assistant {
      margin-right: 24px;
      white-space: normal;
    }
    .message.error {
      background: var(--vscode-inputValidation-errorBackground);
      border: 1px solid var(--vscode-inputValidation-errorBorder);
      color: var(--vscode-inputValidation-errorForeground);
      margin: 0 24px 16px;
      white-space: pre-wrap;
    }

    /* ── markdown inside assistant messages ── */
    .message.assistant p { margin: 0 0 8px; }
    .message.assistant p:last-child { margin-bottom: 0; }
    .message.assistant h1 { font-size: 1.3em; margin: 12px 0 6px; }
    .message.assistant h2 { font-size: 1.15em; margin: 10px 0 4px; }
    .message.assistant h3 { font-size: 1.05em; margin: 8px 0 4px; }
    .message.assistant ul,
    .message.assistant ol { padding-left: 20px; margin: 4px 0 8px; }
    .message.assistant li { margin-bottom: 2px; }
    .message.assistant code {
      font-family: var(--vscode-editor-font-family);
      font-size: 0.9em;
      background: transparent;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .message.assistant pre {
      background: transparent;
      padding: 10px 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid var(--vscode-focusBorder, #4d4d4c);
    }
    .message.assistant pre code {
      background: transparent;
      padding: 0;
      font-size: 0.85em;
      border: none;
    }
    .message.assistant a {
      color: var(--vscode-textLink-foreground);
      text-decoration: none;
    }
    .message.assistant a:hover { text-decoration: underline; }
    .message.assistant blockquote {
      border-left: 3px solid var(--vscode-textBlockQuote-border);
      background: var(--vscode-textBlockQuote-background);
      margin: 8px 0;
      padding: 4px 12px;
    }
    .message.assistant table {
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 0.9em;
    }
    .message.assistant th,
    .message.assistant td {
      border: 1px solid var(--vscode-sideBarSectionHeader-border);
      padding: 6px 10px;
      text-align: left;
    }
    .message.assistant th {
      background: var(--vscode-sideBar-background);
      font-weight: 600;
    }

    /* ── thinking / tool status ── */
    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      margin: 0 24px 16px 0;
      font-size: 12px;
      color: var(--vscode-descriptionForeground);
      font-style: italic;
    }
    .thinking .dots span {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--vscode-descriptionForeground);
      margin-right: 3px;
      animation: dotPulse 1.4s infinite ease-in-out;
    }
    .thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    /* ── reasoning/thinking block ── */
    .thinking-block {
      margin: 0 24px 12px;
      border: 1px solid var(--vscode-sideBarSectionHeader-border);
      border-radius: 6px;
      overflow: hidden;
    }
    .thinking-block summary {
      padding: 6px 10px;
      font-size: 11px;
      color: var(--vscode-descriptionForeground);
      cursor: pointer;
      background: var(--vscode-textBlockQuote-background);
      user-select: none;
    }
    .thinking-block .tc {
      padding: 8px 12px;
      font-size: 12px;
      color: var(--vscode-descriptionForeground);
      max-height: 200px;
      overflow-y: auto;
    }

    .thinking-block .tc table {
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 0.9em;
    }
    .thinking-block .tc th,
    .thinking-block .tc td {
      border: 1px solid var(--vscode-sideBarSectionHeader-border);
      padding: 6px 10px;
      text-align: left;
    }
    .thinking-block .tc th {
      background: var(--vscode-sideBar-background);
      font-weight: 600;
    }

    .thinking-block .tc code {
      font-family: var(--vscode-editor-font-family);
      font-size: 0.9em;
      background: transparent;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .thinking-block .tc pre {
      background: transparent;
      padding: 6px 8px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 4px 0;
      border: none;
    }
    .thinking-block .tc pre code { background: transparent; padding: 0; font-size: 0.85em; border: none; }
    .thinking-block .tc ul,
    .thinking-block .tc ol { padding-left: 20px; margin: 4px 0 8px; }
    .thinking-block .tc li { margin-bottom: 2px; }


    .tool-call {
      margin: 0 24px 8px;
      border: 1px solid var(--vscode-sideBarSectionHeader-border);
      border-radius: 6px;
      overflow: hidden;
      font-size: 11px;
    }
    .tool-call summary {
      padding: 5px 10px;
      color: var(--vscode-descriptionForeground);
      cursor: pointer;
      background: var(--vscode-textBlockQuote-background);
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tool-call summary .tool-name {
      font-weight: 600;
      color: var(--vscode-symbolIcon-functionForeground);
    }
    .tool-call .tool-body {
      padding: 6px 10px;
      font-family: var(--vscode-editor-font-family);
      font-size: 11px;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
      border-top: 1px solid var(--vscode-sideBarSectionHeader-border);
    }
    .tool-call .tool-body.args { color: var(--vscode-descriptionForeground); }
    .tool-call .tool-body.result { color: var(--vscode-foreground); }
  </style>
</head>
<body>

  <!-- ── header ── -->
  <div class="chat-header">
    <h1>Chat</h1>
    <button class="icon-btn" id="sessionsBtn" title="Sessions">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path fill-rule="evenodd" d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm7.25-4v4.44l2.9 2.9 1.06-1.06-2.46-2.46V4h-1.5z" clip-rule="evenodd"/>
      </svg>
    </button>
    <button class="icon-btn" id="newSessionBtn" title="New session">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path fill-rule="evenodd" d="M8 2.5a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2.5z" clip-rule="evenodd"/>
      </svg>
    </button>
    <button class="icon-btn" id="settingsBtn" title="Settings">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path fill-rule="evenodd" d="M9.1 4.4L8.6 2H7.4l-.5 2.4-.7.3-2-1.3-.9.8 1.3 2-.3.7-2.4.5v1.2l2.4.5.3.7-1.3 2 .8.8 2-1.3.7.3.5 2.4h1.2l.5-2.4.7-.3 2 1.3.9-.8-1.3-2 .3-.7 2.4-.5V7.4l-2.4-.5-.3-.7 1.3-2-.8-.8-2 1.3-.7-.3zM9.7 8a1.7 1.7 0 1 1-3.4 0 1.7 1.7 0 0 1 3.4 0z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>

  <!-- ── session list dropdown ── -->
  <div class="session-list" id="sessionList" style="display:none">
    <div class="session-list-header">
      <span>Sessions</span>
      <button class="icon-btn" id="closeSessions">&times;</button>
    </div>
    <div id="sessionItems"></div>
  </div>

  <!-- ── messages ── -->
  <div class="chat-messages" id="messages">
    <div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <div>Ask anything about your code</div>
    </div>
  </div>
  <!-- ── input ── -->
  <div class="chat-input">
    <div class="image-preview-strip" id="imagePreviewStrip"></div>
    <textarea id="userInput" rows="1"
      placeholder="Ask a question... (Enter to send, Shift+Enter for newline)"></textarea>
    <div class="input-toolbar">
      <button id="attachBtn" class="attach-btn" title="Attach images">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M5.5 4.5V11a3 3 0 0 0 6 0V4a2 2 0 0 0-4 0v7a1 1 0 0 0 2 0V4"/>
        </svg>
      </button>
      <div class="toolbar-right">
        <select id="modelSelect">
          <option value="">No models</option>
        </select>
        <button id="sendBtn" title="Send">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M15.854.146a.5.5 0 0 1 .113.534l-5 14a.5.5 0 0 1-.934.028L7.76 9.24 3.292 6.967a.5.5 0 0 1 .028-.934l14-5a.5.5 0 0 1 .534.113z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script>
    var vscode = acquireVsCodeApi();
    var messagesEl = document.getElementById("messages");
    var textarea = document.getElementById("userInput");
    var sendBtn = document.getElementById("sendBtn");
    var modelSelect = document.getElementById("modelSelect");
    var settingsBtn = document.getElementById("settingsBtn");
    var sessionsBtn = document.getElementById("sessionsBtn");
    var newSessionBtn = document.getElementById("newSessionBtn");
    var sessionList = document.getElementById("sessionList");
    var sessionItems = document.getElementById("sessionItems");
    var closeSessions = document.getElementById("closeSessions");
    var attachBtn = document.getElementById("attachBtn");
    var imagePreviewStrip = document.getElementById("imagePreviewStrip");

    var CONFIGURE_VALUE = "__configure__";
    var currentModelId = "";
    var isStreaming = false;
    var streamingMsgId = null;

    var streamingEl = null;
    var thinkingEl = null;
    var currentMode = null; // "thinking" | "text" | null
    var attachedImages = []; // [{ id, name, dataUrl, size, warning? }]

    // ── scroll helpers ──
    function isNearBottom() {
      var threshold = 50;
      return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < threshold;
    }

    function scrollToBottom(wasNear) {
      if (wasNear === undefined ? isNearBottom() : wasNear) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }

    // ── send ──
    function sendMessage() {
      var t = textarea.value.trim();
      if ((!t && attachedImages.length === 0) || isStreaming) return;
      var mid = "msg-" + Date.now();
      addMsg("user", t, mid, false, attachedImages.length > 0 ? attachedImages : undefined);
      var payload = { type: "sendMessage", messageId: mid, text: t };
      if (attachedImages.length > 0) {
        payload.images = attachedImages.map(function(img) {
          return { id: img.id, name: img.name, dataUrl: img.dataUrl, size: img.size };
        });
      }
      vscode.postMessage(payload);
      textarea.value = "";
      autoResize();
      attachedImages = [];
      renderImagePreviews();
      showThinking("Thinking\u2026");
      closeStream();
      setBusy(true);
    }

    // ── message rendering ──
    function addMsg(role, text, msgId, append, images) {
      var es = messagesEl.querySelector(".empty-state");
      if (es) es.remove();

      var nearBottom = isNearBottom();
      if (append && streamingEl) {
        streamingEl._rt = (streamingEl._rt || "") + text;
        streamingEl.innerHTML = renderMD(streamingEl._rt);
      } else {
        var el = document.createElement("div");
        el.className = "message " + role;
        if (msgId) el.dataset.msgId = msgId;
        if (role === "assistant") {
          el._rt = text;
          el.innerHTML = renderMD(text);
          streamingEl = el;
          streamingMsgId = msgId;
        } else {
          el.textContent = text;
          // Render attached images as thumbnails
          if (images && images.length > 0) {
            var imgsDiv = document.createElement("div");
            imgsDiv.className = "msg-images";
            images.forEach(function(img) {
              var thumb = document.createElement("div");
              thumb.className = "msg-image";
              thumb.title = img.name || "";
              var pic = document.createElement("img");
              pic.src = img.dataUrl;
              pic.alt = img.name || "attached image";
              thumb.appendChild(pic);
              imgsDiv.appendChild(thumb);
            });
            el.appendChild(imgsDiv);
          }
        }
        messagesEl.appendChild(el);
      }
      scrollToBottom(nearBottom);
    }

    // ── thinking indicator ──
    function showThinking(label) {
      hideThinking();
      var nearBottom = isNearBottom();
      thinkingEl = document.createElement("div");
      thinkingEl.className = "thinking";
      thinkingEl.innerHTML =
        "<span>" + escH(label) + "</span>" +
        "<span class='dots'><span></span><span></span><span></span></span>";
      messagesEl.appendChild(thinkingEl);
      scrollToBottom(nearBottom);
    }

    function hideThinking() {
      if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
    }

    // ── markdown renderer (uses marked library) ──
    function renderMD(text) {
      return marked.parse(text, { gfm: true, breaks: true });
    }

    function escH(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    // ── textarea auto-resize ──
    function autoResize() {
      textarea.style.height = "auto";
      textarea.style.height = textarea.scrollHeight + "px";
    }

    // ── image attachments ──
    function renderImagePreviews() {
      imagePreviewStrip.innerHTML = "";
      if (attachedImages.length === 0) {
        imagePreviewStrip.style.display = "none";
        return;
      }
      imagePreviewStrip.style.display = "flex";

      var largeImages = attachedImages.filter(function(img) { return img.warning; });
      if (largeImages.length > 0) {
        var warn = document.createElement("div");
        warn.className = "image-size-warn";
        warn.textContent = largeImages.length + " image(s) are large (>5MB) and may be slow to process.";
        imagePreviewStrip.appendChild(warn);
      }

      attachedImages.forEach(function(img) {
        var thumb = document.createElement("div");
        thumb.className = "image-thumb" + (img.warning ? " warn" : "");
        var pic = document.createElement("img");
        pic.src = img.dataUrl;
        pic.alt = img.name;
        thumb.appendChild(pic);
        var rm = document.createElement("button");
        rm.className = "remove-btn";
        rm.textContent = "\u00d7";
        rm.title = "Remove " + img.name;
        rm.addEventListener("click", function(e) {
          e.stopPropagation();
          removeImage(img.id);
        });
        thumb.appendChild(rm);
        imagePreviewStrip.appendChild(thumb);
      });
    }

    function removeImage(id) {
      attachedImages = attachedImages.filter(function(img) { return img.id !== id; });
      renderImagePreviews();
    }

    var sendBtnHtml = sendBtn.innerHTML;
    function setBusy(busy) {
      isStreaming = busy;
      if (busy) {
        sendBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="4" width="8" height="8" rx="2"/></svg>';
        sendBtn.classList.add("stop-btn");
        sendBtn.title = "Stop";
      } else {
        sendBtn.innerHTML = sendBtnHtml;
        sendBtn.classList.remove("stop-btn");
        sendBtn.title = "Send";
      }
    }

    // ── model dropdown ──
    function populateModels(models, activeModel) {
      currentModelId = activeModel;
      modelSelect.innerHTML = "";

      if (!models || models.length === 0) {
        var o = document.createElement("option");
        o.value = "";
        o.textContent = "No models";
        modelSelect.appendChild(o);
      } else {
        models.forEach(function (m) {
          var o = document.createElement("option");
          o.value = m.id;
          o.textContent = m.name;
          if (m.id === activeModel) o.selected = true;
          modelSelect.appendChild(o);
        });
      }

      var divider = document.createElement("option");
      divider.disabled = true;
      divider.textContent = "----------";
      modelSelect.appendChild(divider);

      var configOpt = document.createElement("option");
      configOpt.value = CONFIGURE_VALUE;
      configOpt.textContent = "Configure models\u2026";
      modelSelect.appendChild(configOpt);
    }

    // ── event listeners ──
    textarea.addEventListener("input", autoResize);
    textarea.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener("click", function () {
      if (isStreaming) {
        vscode.postMessage({ type: "cancelMessage" });
      } else {
        sendMessage();
      }
    });

    attachBtn.addEventListener("click", function () {
      vscode.postMessage({ type: "attachImage" });
    });

    modelSelect.addEventListener("change", function () {
      var v = modelSelect.value;
      if (v === CONFIGURE_VALUE) {
        vscode.postMessage({ type: "configureModels" });
        modelSelect.value = currentModelId;
        return;
      }
      if (v) {
        currentModelId = v;
        vscode.postMessage({ type: "setModel", modelId: v });
      }
    });

    settingsBtn.addEventListener("click", function () {
      vscode.postMessage({ type: "configureModels" });
    });

    sessionsBtn.addEventListener("click", function () {
      vscode.postMessage({ type: "requestSessions" });
      sessionList.style.display = sessionList.style.display === "none" ? "" : "none";
    });
    closeSessions.addEventListener("click", function () {
      sessionList.style.display = "none";
    });
    newSessionBtn.addEventListener("click", function () {
      vscode.postMessage({ type: "newSession" });
      sessionList.style.display = "none";
    });

    // ── host messages ──
    window.addEventListener("message", function (e) {
      var m = e.data;

      if (m.type === "modelsLoaded") {
        populateModels(m.models, m.activeModel);

      } else if (m.type === "sessionsLoaded") {
        renderSessions(m.sessions, m.currentSessionId);

      } else if (m.type === "clearChat") {
        messagesEl.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><div>Ask anything about your code</div></div>';

      } else if (m.type === "historyRestored") {
        // Clear and rebuild all messages
        closeStream();
        hideThinking();
        messagesEl.innerHTML = '';
        var msgs = m.messages || [];
        if (msgs.length === 0) {
          messagesEl.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><div>Ask anything about your code</div></div>';
        } else {
          msgs.forEach(function (msg) {
            if (msg.role === 'user') {
              addMsg('user', msg.content, undefined, false, msg.images);
            } else if (msg.role === 'assistant') {
              addMsg('assistant', msg.content);
            }
          });
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }

      } else if (m.type === "thinkingDelta") {
        hideThinking();
        if (currentMode !== "thinking") {
          closeStream();
          streamingEl = document.createElement("details");
          streamingEl.className = "thinking-block";
          streamingEl.innerHTML = "<summary>Thinking</summary><div class=tc></div>";
          streamingEl.open = true;
          messagesEl.appendChild(streamingEl);
          streamingMsgId = m.messageId;
          currentMode = "thinking";
        }
        var nearBottom = isNearBottom();
        var tc = streamingEl.querySelector(".tc");
        tc._rt = (tc._rt || "") + m.text;
        tc.innerHTML = renderMD(tc._rt);
        scrollToBottom(nearBottom);
      } else if (m.type === "toolCall") {
        hideThinking();
        closeStream();
        var nearBottom = isNearBottom();
        var tc = document.createElement("details");
        tc.className = "tool-call";
        tc.innerHTML =
          "<summary><span class=tool-name>" + escH(m.toolName) + "</span></summary>" +
          "<div class='tool-body args'>" + escH(m.args || "") + "</div>" +
          "<div class='tool-body result'>" + escH(m.result || "(no output)") + "</div>";
        messagesEl.appendChild(tc);
        scrollToBottom(nearBottom);
      } else if (m.type === "toolStatus") {
        showThinking(m.text);
      } else if (m.type === "partialResponse") {
        hideThinking();
        var nearBottom = isNearBottom();
        if (currentMode !== "text") {
          closeStream();
          streamingEl = document.createElement("div");
          streamingEl.className = "message assistant";
          messagesEl.appendChild(streamingEl);
          streamingMsgId = m.messageId;
          currentMode = "text";
        }
        streamingEl._rt = (streamingEl._rt || "") + m.text;
        streamingEl.innerHTML = renderMD(streamingEl._rt);
        scrollToBottom(nearBottom);
      } else if (m.type === "responseComplete") {
        closeStream();
        hideThinking();
        setBusy(false);
      } else if (m.type === "error") {
        closeStream();
        hideThinking();
        setBusy(false);
        addMsg("error", "Error: " + m.error);
      } else if (m.type === "imagesAttached") {
        if (m.images && m.images.length > 0) {
          m.images.forEach(function(img) {
            attachedImages.push(img);
          });
          renderImagePreviews();
        }
      } else if (m.type === "imagesAttachedError") {
        if (m.errors && m.errors.length > 0) {
          m.errors.forEach(function(err) {
            addMsg("error", "Attachment error: " + err.name + " - " + err.error);
          });
        }
      }
    });

    function closeStream() {
      streamingEl = null;
      streamingMsgId = null;
      currentMode = null;
    }

    function renderSessions(sessions, currentId) {
      sessionItems.innerHTML = sessions.map(function(s) {
        var active = s.id === currentId ? " active" : "";
        var time = new Date(s.updatedAt).toLocaleDateString();
        return '<div class="session-item' + active + '" data-id="' + escH(s.id) + '">' +
          '<span class="si-title">' + escH(s.title || "New session") + '</span>' +
          '<span class="si-time">' + escH(time) + '</span>' +
          '<button class="si-del" data-id="' + escH(s.id) + '" title="Delete">&times;</button>' +
        '</div>';
      }).join('');
      sessionItems.querySelectorAll('.session-item').forEach(function(el) {
        el.addEventListener('click', function(e) {
          if (e.target.classList.contains('si-del')) return;
          vscode.postMessage({ type: 'switchSession', sessionId: el.dataset.id });
          sessionList.style.display = 'none';
        });
      });
      sessionItems.querySelectorAll('.si-del').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          vscode.postMessage({ type: 'deleteSession', sessionId: btn.dataset.id });
        });
      });
    }

    textarea.focus();
    vscode.postMessage({ type: "requestModels" });
  </script>
</body>
</html>
